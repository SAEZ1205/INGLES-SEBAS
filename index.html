<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Vocabulario</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap');

  :root{
    --bg:#0A0D16;
    --bg2:#111726;
    --panel:#141B2C;
    --line:#232C42;
    --cyan:#3DF2FF;
    --magenta:#FF3DBE;
    --green:#39FF88;
    --green-dim:#1E4A34;
    --red:#FF3B4E;
    --red-dim:#4A1E26;
    --text:#E7ECFB;
    --muted:#6E7A99;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 0%, rgba(61,242,255,.08), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(255,61,190,.08), transparent 45%),
      var(--bg);
    font-family:'Rajdhani',sans-serif;
    color:var(--text);
    display:flex;
    justify-content:center;
    padding:32px 16px 60px;
  }
  .app{width:100%;max-width:480px;}
  .sync-warning{
    display:none;
    background:var(--red-dim);border:1px solid var(--red);color:var(--red);
    font-size:12px;font-family:'IBM Plex Mono',monospace;line-height:1.5;
    padding:10px 12px;border-radius:8px;margin-bottom:16px;
  }
  .layout{display:block;}
  .study{margin-bottom:4px;}
  .side{display:flex;flex-direction:column;gap:4px;}

  @media (max-width:400px){
    body{padding:20px 12px 48px;}
    .topbar h1{font-size:19px;}
    .stage{height:230px;}
    .word{font-size:21px;}
    .btn{font-size:13px;padding:12px 8px;}
  }

  @media (min-width:820px){
    body{padding:56px 24px 80px;align-items:flex-start;}
    .app{max-width:920px;}
    .topbar h1{font-size:28px;}
    .layout{
      display:grid;
      grid-template-columns:380px 1fr;
      gap:32px;
      align-items:start;
    }
    .stage{height:340px;}
    .word{font-size:32px;}
    .face{padding:32px;}
    .side{gap:20px;}
    .panel-box{
      border-top:none;padding-top:0;
      background:var(--panel);border:1px solid var(--line);
      border-radius:12px;padding:18px 20px;
    }
    .panel-box[open] summary{margin-bottom:16px;}
    .list{max-height:400px;}
  }

  .topbar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px;}
  .topbar h1{
    font-family:'Orbitron',sans-serif;font-weight:800;font-size:22px;margin:0;
    letter-spacing:1px;color:var(--cyan);
    text-shadow:0 0 14px rgba(61,242,255,.5);
  }
  .topbar .count{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}

  .progress-track{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:26px;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--magenta));transition:width .35s ease;}

  .stage{position:relative;height:280px;margin-bottom:20px;}
  .stack-shadow{
    position:absolute;inset:0;
    background:var(--bg2);
    border-radius:14px;
    border:1px solid var(--line);
    transform:translateY(10px) scale(0.96);
  }
  .stack-shadow.s2{transform:translateY(18px) scale(0.92);opacity:.6;}

  .card{
    position:absolute;inset:0;
    cursor:pointer;
    perspective:1200px;
  }
  .card-inner{
    position:relative;width:100%;height:100%;
    transform-style:preserve-3d;
    transition:transform .45s cubic-bezier(.2,.8,.2,1);
  }
  .card.flipped .card-inner{transform:rotateY(180deg);}

  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;
    border-radius:14px;
    background:var(--panel);
    border:1px solid var(--cyan);
    box-shadow:0 0 22px rgba(61,242,255,.18), inset 0 0 30px rgba(61,242,255,.04);
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:20px;
  }
  .face-back{
    transform:rotateY(180deg);
    border-color:var(--magenta);
    box-shadow:0 0 22px rgba(255,61,190,.18), inset 0 0 30px rgba(255,61,190,.04);
  }

  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--cyan);margin-bottom:14px;
  }
  .face-back .eyebrow{color:var(--magenta);}
  .word{
    font-family:'Orbitron',sans-serif;font-weight:600;font-size:26px;
    color:var(--text);text-align:center;line-height:1.25;
  }
  .hint{
    margin-top:14px;font-size:12px;color:var(--muted);
    font-family:'IBM Plex Mono',monospace;
  }

  .actions{display:flex;gap:10px;margin-bottom:26px;}
  .btn{
    flex:1;padding:13px 10px;border-radius:8px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-size:15px;font-weight:600;
    cursor:pointer;font-family:'Rajdhani',sans-serif;letter-spacing:.03em;
    display:flex;align-items:center;justify-content:center;gap:6px;
    text-transform:uppercase;
  }
  .btn:active{transform:scale(0.98);}
  .btn.review{color:var(--red);border-color:var(--red);box-shadow:0 0 14px rgba(255,59,78,.15);}
  .btn.known{color:var(--green);border-color:var(--green);box-shadow:0 0 14px rgba(57,255,136,.15);}
  .btn.ghost{flex:none;padding:13px 14px;color:var(--muted);text-transform:none;font-weight:500;}

  .row{display:flex;gap:10px;margin-bottom:10px;}

  .panel-box{
    margin-top:8px;border-top:1px solid var(--line);padding-top:16px;
  }
  .panel-box summary{
    cursor:pointer;font-size:13px;color:var(--muted);
    list-style:none;display:flex;align-items:center;gap:6px;
    text-transform:uppercase;letter-spacing:.05em;font-family:'IBM Plex Mono',monospace;
  }
  .panel-box summary::-webkit-details-marker{display:none;}
  .panel-box[open] summary{margin-bottom:14px;color:var(--cyan);}

  .form-row{display:flex;gap:8px;margin-bottom:8px;}
  input[type=text]{
    flex:1;padding:10px 12px;border-radius:8px;border:1px solid var(--line);
    background:var(--bg2);color:var(--text);font-size:14px;font-family:'Rajdhani',sans-serif;
  }
  input[type=text]::placeholder{color:var(--muted);}
  input[type=text]:focus{outline:none;border-color:var(--cyan);}
  .add-btn{
    padding:10px 16px;border-radius:8px;border:1px solid var(--cyan);
    background:var(--bg2);color:var(--cyan);font-size:14px;cursor:pointer;
    font-family:'Rajdhani',sans-serif;font-weight:600;
  }

  .list{max-height:280px;overflow-y:auto;}
  .list-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:9px 4px;border-bottom:1px solid var(--line);font-size:13px;gap:10px;
  }
  .li-words{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .list-item .li-en{font-weight:600;}
  .li-rounds{color:var(--cyan);font-family:'IBM Plex Mono',monospace;font-size:11px;}
  .list-item .li-es{color:var(--muted);margin-left:6px;}
  .li-right{display:flex;align-items:center;gap:10px;flex:none;}
  .dots{display:flex;gap:3px;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--line);}
  .dot.g{background:var(--green);box-shadow:0 0 5px rgba(57,255,136,.7);}
  .dot.r{background:var(--red);box-shadow:0 0 5px rgba(255,59,78,.7);}
  .li-del{
    background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;
    padding:2px 4px;
  }
  .empty-msg{font-size:13px;color:var(--muted);text-align:center;padding:30px 0;}

  .stat-group{margin-bottom:16px;}
  .stat-title{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;
    text-transform:uppercase;margin-bottom:8px;
  }
  .stat-title.needs{color:var(--red);}
  .stat-title.good{color:var(--green);}
  .stat-row{
    display:flex;justify-content:space-between;font-size:13px;
    padding:6px 0;border-bottom:1px solid var(--line);
  }
  .stat-row .es{color:var(--muted);}

  .accuracy-pill{
    display:flex;align-items:baseline;gap:10px;
    background:var(--bg2);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;margin-bottom:16px;
  }
  .acc-num{
    font-family:'Orbitron',sans-serif;font-weight:800;font-size:22px;
    color:var(--cyan);text-shadow:0 0 10px rgba(61,242,255,.4);
  }
  .acc-label{font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}
</style>
</head>
<body>
<div class="app">

  <div id="syncWarning" class="sync-warning">
    ⚠ sin sincronización — configura JSONBIN_ID y JSONBIN_KEY en el archivo (mira los comentarios arriba del script) para que tu progreso se guarde entre dispositivos.
  </div>

  <div class="topbar">
    <h1>VOCABULARIO</h1>
    <div class="count" id="counter">0 / 0</div>
  </div>

  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

  <div class="layout">

    <div class="study">
      <div class="stage" id="stage">
        <div class="stack-shadow s2"></div>
        <div class="stack-shadow"></div>
        <div class="card" id="card">
          <div class="card-inner">
            <div class="face face-front">
              <div class="eyebrow" id="frontLabel">Inglés</div>
              <div class="word" id="frontWord">—</div>
              <div class="hint">toca para voltear</div>
            </div>
            <div class="face face-back">
              <div class="eyebrow" id="backLabel">Español</div>
              <div class="word" id="backWord">—</div>
              <div class="hint">toca para voltear</div>
            </div>
          </div>
        </div>
      </div>

      <div class="actions">
        <button class="btn review" id="btnReview">✕ repasar</button>
        <button class="btn known" id="btnKnown">✓ lo sé</button>
      </div>
      <div class="row">
        <button class="btn ghost" id="btnDir">⇄ EN→ES</button>
        <button class="btn ghost" id="btnShuffle">⤮ mezclar</button>
      </div>
    </div>

    <div class="side">
      <details class="panel-box">
        <summary>⚡ estadísticas</summary>
        <div id="statsBox"></div>
      </details>

      <details class="panel-box">
        <summary>+ agregar / administrar palabras</summary>
        <div class="form-row">
          <input type="text" id="inputEn" placeholder="inglés">
          <input type="text" id="inputEs" placeholder="español">
          <button class="add-btn" id="btnAdd">añadir</button>
        </div>
        <div class="list" id="wordList"></div>
      </details>
    </div>

  </div>

</div>

<script>
const seed = [
  ["forbearance","paciencia"],["may","puede"],["grown-up","adulto"],
  ["everything","todo"],["even","incluso"],["hungry","hambriento"],
  ["cheering","alegre"],["enough","suficiente"],
  ["whom","a quien"],["grew","creció"],["although","aunque"],
  ["ATM","cajero automático"],["makeup","maquillaje"],["furniture","mueble"],
  ["letters","letras"],["slides","diapositivas"],
  ["gonna","voy a (forma informal de \"going to\")"],["wand","varita"],
  ["handle it","manejarlo / encargarse de ello"],["screaming","gritando"],
  ["send","enviar"],["sobbing","sollozando / llorando desconsoladamente"],
  ["wayward","rebelde / descarriado"],["sweetheart","cariño / amor / querido(a)"],
  ["safer","más seguro"],["place","lugar"],["laughter","risa"],
  ["roars","rugidos / ruge"],["another","otro / otra"],["someone","alguien"],
  ["trouble","problema / problemas"],["looks","parece / mira"],
  ["like","como / gustar"],["looks like","parece"],["guess","adivinar / supongo"],
  ["everyone","todos / todo el mundo"],["feeling","sentimiento / sintiendo"],
  ["must","debe / debe de"],["embarrassed","avergonzado"],
  ["right","correcto / derecha / bien"],["pretty","bonito / bastante / muy (intensificador)"],
  ["meet","conocer / encontrarse con"],["foreign","extranjero"],
  ["exchange student","estudiante de intercambio"],["change","cambiar"],
  ["growls","gruñe / gruñidos"],["misunderstood","malinterpretado / incomprendido"],
  ["showing","mostrando"],["whatever","lo que sea / da igual"],
  ["heard","escuchó / oído"],["careful","cuidadoso / ten cuidado"],
  ["helmet","casco"],["labeled","etiquetado"],
  ["taking risks","tomando riesgos / arriesgándose"],["frankly","francamente"],
  ["thought","pensamiento / pensó"],["won't","no hará / no va a"],
  ["will","será / hará / va a"],["gotten","obtenido / conseguido"],
  ["puppies","cachorros"],["tracked","rastreado / seguido"],
  ["hidden","escondido / oculto"],["I've","he / yo he"],
  ["wish","desear / deseo"],["anymore","ya no"],
  ["moving","moviendo / mudándose"],["deal","trato / acuerdo / lidiar con"],
  ["I'll","yo voy a / yo haré"],["come","venir"],
  ["refill","rellenar / volver a llenar"],["let","dejar / permitir"],
  ["inside","dentro / adentro"],["soggy","empapado / húmedo"],
  ["bring","traer"],["tell","decir / contar"],
  ["anything","cualquier cosa / nada (según contexto)"],
  ["unguarded","sin vigilancia / desprevenido"],
  ["work out","hacer ejercicio / resolver / funcionar"],["morons","idiotas"],
  ["come on","vamos / anda / date prisa"],["back","atrás / de vuelta / espalda"],
  ["ever","alguna vez"],["taken","tomado / llevado"],["done","hecho / terminado"],
  ["bake","hornear"],["stages","etapas"],
  ["sick","enfermo / asqueroso (según contexto)"],["hall","pasillo / salón"],
  ["teenager","adolescente"]
];

let cards = [];
let queue = [];
let current = null;
let flipped = false;
let direction = 'en-es';
let sessionSeen = new Set();

// ---- CONFIGURACIÓN DE SINCRONIZACIÓN EN LA NUBE ----
// 1. Entra a https://jsonbin.io y crea una cuenta gratis.
// 2. Crea un "bin" nuevo con el contenido: []
// 3. Copia el "Bin ID" y pégalo abajo en JSONBIN_ID.
// 4. En tu cuenta ve a API Keys, copia la "X-Master-Key" y pégala en JSONBIN_KEY.
// 5. Sube el archivo con esos dos valores ya puestos a tu repositorio de GitHub.
// Así el mismo bin se lee y escribe desde cualquier dispositivo que abra el link.
const JSONBIN_ID = '6a62572ada38895dfe861422';
const JSONBIN_KEY = '$2a$10$q9Jjy8aXkFGBYLcTTwdoguLqkojGM0pi91bik2kK67ZtRcvLqQ3um';
const CLOUD_READY = !JSONBIN_ID.startsWith('PON_AQUI') && !JSONBIN_KEY.startsWith('PON_AQUI');

function uid(){ return Math.random().toString(36).slice(2,9); }

async function cloudGet(){
  if(!CLOUD_READY) return null;
  try{
    const res = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_ID}/latest`, {
      headers:{ 'X-Master-Key': JSONBIN_KEY }
    });
    if(!res.ok) return null;
    const data = await res.json();
    return Array.isArray(data.record) ? data.record : null;
  }catch(e){ console.error('cloud load error', e); return null; }
}

async function cloudSet(payload){
  if(!CLOUD_READY) return;
  try{
    await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_ID}`, {
      method:'PUT',
      headers:{ 'Content-Type':'application/json', 'X-Master-Key': JSONBIN_KEY },
      body: JSON.stringify(payload)
    });
  }catch(e){ console.error('cloud save error', e); }
}

async function load(){
  const banner = document.getElementById('syncWarning');
  if(!CLOUD_READY){
    banner.style.display = 'block';
  }
  const remote = await cloudGet();
  cards = remote || [];
  cards.forEach(c => {
    if(!Array.isArray(c.history)) c.history = [];
    if(typeof c.rounds !== 'number') c.rounds = 0;
    if(typeof c.totalKnown !== 'number') c.totalKnown = 0;
    if(typeof c.totalReview !== 'number') c.totalReview = 0;
    c.known = false;
  });
  const existing = new Set(cards.map(c => c.en.toLowerCase()));
  let added = false;
  seed.forEach(([en,es]) => {
    if(!existing.has(en.toLowerCase())){
      cards.push({id:uid(), en, es, known:false, history:[], rounds:0, totalKnown:0, totalReview:0});
      existing.add(en.toLowerCase());
      added = true;
    }
  });
  await save();
  sessionSeen = new Set();
  buildQueue();
  renderList();
  renderStats();
  showNext();
}

async function save(){
  await cloudSet(cards);
}

function buildQueue(){
  queue = cards.filter(c => !c.known).map(c => c.id);
  shuffleArray(queue);
}

function shuffleArray(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
}

function updateCounter(){
  document.getElementById('counter').textContent = `${sessionSeen.size} / ${cards.length}`;
  const pct = cards.length ? Math.round(sessionSeen.size/cards.length*100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
}

function showNext(){
  flipped = false;
  document.getElementById('card').classList.remove('flipped');
  updateCounter();

  if(cards.length === 0){
    document.getElementById('frontWord').textContent = 'sin tarjetas';
    document.getElementById('backWord').textContent = '';
    current = null;
    return;
  }
  if(queue.length === 0){
    buildQueue();
    if(queue.length === 0){
      document.getElementById('frontWord').textContent = '¡todo aprendido!';
      document.getElementById('backWord').textContent = '🏆';
      current = null;
      return;
    }
  }
  const id = queue[0];
  current = cards.find(c => c.id === id);
  renderCard();
}

function renderCard(){
  if(!current) return;
  const frontIsEn = direction === 'en-es';
  document.getElementById('frontLabel').textContent = frontIsEn ? 'Inglés' : 'Español';
  document.getElementById('backLabel').textContent = frontIsEn ? 'Español' : 'Inglés';
  document.getElementById('frontWord').textContent = frontIsEn ? current.en : current.es;
  document.getElementById('backWord').textContent = frontIsEn ? current.es : current.en;
}

document.getElementById('card').addEventListener('click', () => {
  if(!current) return;
  flipped = !flipped;
  document.getElementById('card').classList.toggle('flipped', flipped);
});

function pushHistory(card, mark){
  card.history.push(mark);
  if(mark === 'g') card.totalKnown = (card.totalKnown || 0) + 1;
  else card.totalReview = (card.totalReview || 0) + 1;
  if(card.history.length >= 5){
    card.history = [];
    card.rounds = (card.rounds || 0) + 1;
  }
}

document.getElementById('btnKnown').addEventListener('click', async () => {
  if(!current) return;
  current.known = true;
  pushHistory(current, 'g');
  sessionSeen.add(current.id);
  queue.shift();
  await save();
  renderList();
  renderStats();
  showNext();
});

document.getElementById('btnReview').addEventListener('click', async () => {
  if(!current) return;
  current.known = false;
  pushHistory(current, 'r');
  sessionSeen.add(current.id);
  const id = queue.shift();
  queue.push(id);
  await save();
  renderList();
  renderStats();
  showNext();
});

document.getElementById('btnDir').addEventListener('click', () => {
  direction = direction === 'en-es' ? 'es-en' : 'en-es';
  document.getElementById('btnDir').textContent = direction === 'en-es' ? '⇄ EN→ES' : '⇄ ES→EN';
  flipped = false;
  document.getElementById('card').classList.remove('flipped');
  renderCard();
});

document.getElementById('btnShuffle').addEventListener('click', async () => {
  cards.forEach(c => { c.known = false; });
  sessionSeen = new Set();
  buildQueue();
  await save();
  renderList();
  renderStats();
  showNext();
});

document.getElementById('btnAdd').addEventListener('click', async () => {
  const en = document.getElementById('inputEn').value.trim();
  const es = document.getElementById('inputEs').value.trim();
  if(!en || !es) return;
  cards.push({id:uid(), en, es, known:false, history:[], rounds:0, totalKnown:0, totalReview:0});
  document.getElementById('inputEn').value = '';
  document.getElementById('inputEs').value = '';
  await save();
  buildQueue();
  renderList();
  renderStats();
  if(!current) showNext();
});

function renderList(){
  const list = document.getElementById('wordList');
  list.innerHTML = '';
  if(cards.length === 0){
    list.innerHTML = '<div class="empty-msg">todavía no hay palabras</div>';
    return;
  }
  cards.slice().sort((a,b) => a.en.localeCompare(b.en)).forEach(c => {
    const row = document.createElement('div');
    row.className = 'list-item';

    const words = document.createElement('span');
    words.className = 'li-words';
    const roundsTag = c.rounds > 0 ? ` <span class="li-rounds">(${c.rounds})</span>` : '';
    words.innerHTML = `<span class="li-en">${escapeHtml(c.en)}</span>${roundsTag}<span class="li-es">— ${escapeHtml(c.es)}</span>`;

    const right = document.createElement('span');
    right.className = 'li-right';

    const dots = document.createElement('span');
    dots.className = 'dots';
    const hist = c.history.slice(-5);
    const padded = hist.concat(Array(5 - hist.length).fill(null));
    padded.forEach(m => {
      const d = document.createElement('span');
      d.className = 'dot' + (m === 'g' ? ' g' : m === 'r' ? ' r' : '');
      dots.appendChild(d);
    });

    const del = document.createElement('button');
    del.className = 'li-del';
    del.innerHTML = '&times;';
    del.addEventListener('click', async () => {
      cards = cards.filter(x => x.id !== c.id);
      await save();
      buildQueue();
      renderList();
      renderStats();
      showNext();
    });

    right.appendChild(dots);
    right.appendChild(del);
    row.appendChild(words);
    row.appendChild(right);
    list.appendChild(row);
  });
}

function renderStats(){
  const box = document.getElementById('statsBox');
  box.innerHTML = '';

  const totalG = cards.reduce((sum,c) => sum + (c.totalKnown || 0), 0);
  const totalR = cards.reduce((sum,c) => sum + (c.totalReview || 0), 0);
  const totalAttempts = totalG + totalR;

  if(totalAttempts === 0){
    box.innerHTML = '<div class="empty-msg">practica unas rondas y aquí verás tus palabras débiles y fuertes</div>';
    return;
  }

  const accuracy = Math.round((totalG / totalAttempts) * 100);
  const totalRounds = cards.reduce((sum,c) => sum + (c.rounds || 0), 0);
  const acc = document.createElement('div');
  acc.className = 'accuracy-pill';
  acc.innerHTML = `<span class="acc-num">${accuracy}%</span><span class="acc-label">precisión general · ${totalRounds} vueltas completadas</span>`;
  box.appendChild(acc);

  const withHistory = cards.filter(c => c.history.length > 0);
  const scored = withHistory.map(c => {
    const hist = c.history.slice(-5);
    const reds = hist.filter(m => m === 'r').length;
    const greens = hist.filter(m => m === 'g').length;
    return {c, reds, greens};
  });

  const needsWork = scored.filter(s => s.reds > 0)
    .sort((a,b) => b.reds - a.reds || b.c.history.length - a.c.history.length)
    .slice(0,5);

  const solid = scored.filter(s => s.reds === 0 && s.greens > 0)
    .sort((a,b) => b.greens - a.greens)
    .slice(0,5);

  if(needsWork.length){
    const g = document.createElement('div');
    g.className = 'stat-group';
    g.innerHTML = '<div class="stat-title needs">⚠ repasa más</div>';
    needsWork.forEach(s => {
      const row = document.createElement('div');
      row.className = 'stat-row';
      row.innerHTML = `<span>${escapeHtml(s.c.en)}</span><span class="es">${escapeHtml(s.c.es)}</span>`;
      g.appendChild(row);
    });
    box.appendChild(g);
  }

  if(solid.length){
    const g = document.createElement('div');
    g.className = 'stat-group';
    g.innerHTML = '<div class="stat-title good">✓ las dominas</div>';
    solid.forEach(s => {
      const row = document.createElement('div');
      row.className = 'stat-row';
      row.innerHTML = `<span>${escapeHtml(s.c.en)}</span><span class="es">${escapeHtml(s.c.es)}</span>`;
      g.appendChild(row);
    });
    box.appendChild(g);
  }

  if(!needsWork.length && !solid.length){
    box.innerHTML = '<div class="empty-msg">practica unas rondas y aquí verás tus palabras débiles y fuertes</div>';
  }
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

load();
</script>
</body>
</html>
