name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - 'android-src/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Prepare offline web assets
        run: |
          rm -rf www
          mkdir -p www/vendor
          cp index.html www/index.html
          cp android-src/android-addon.js www/android-addon.js
          cp -R node_modules/@fontsource/orbitron www/vendor/orbitron
          cp -R node_modules/@fontsource/rajdhani www/vendor/rajdhani
          cp -R node_modules/@fontsource/ibm-plex-mono www/vendor/ibm-plex-mono

      - name: Generate Android project
        run: npx cap add android

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Install Android native additions
        run: |
          cp android-src/MainActivity.java android/app/src/main/java/com/saez1205/inglessebas/MainActivity.java
          mkdir -p android/app/src/main/res/drawable
          cp android-src/ic_ingles_sebas.xml android/app/src/main/res/drawable/ic_ingles_sebas.xml
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          if 'android.permission.RECORD_AUDIO' not in s:
              s=s.replace('<manifest ', '<manifest ', 1)
              pos=s.find('>')
              s=s[:pos+1]+'\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />'+s[pos+1:]
          s=re.sub(r'android:icon="[^"]+"', 'android:icon="@drawable/ic_ingles_sebas"', s)
          s=re.sub(r'android:roundIcon="[^"]+"', 'android:roundIcon="@drawable/ic_ingles_sebas"', s)
          p.write_text(s)
          PY

      - name: Set Android app version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/build.gradle')
          s=p.read_text()
          s=re.sub(r'versionCode\s+\d+', 'versionCode 3', s)
          s=re.sub(r'versionName\s+"[^"]+"', 'versionName "1.1.0"', s)
          p.write_text(s)
          PY

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Create stable signing identity
        run: |
          python3 -m pip install --quiet pycryptodome cryptography
          python3 android-src/make_signing.py

      - name: Sign and verify APK
        run: |
          BUILD_TOOLS=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk INGLES-SEBAS-aligned.apk
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign --ks /tmp/ingles-sebas.p12 --ks-type PKCS12 --ks-pass pass:InglesSebasSideload2026 --key-pass pass:InglesSebasSideload2026 --out INGLES-SEBAS-v2.0.0.apk INGLES-SEBAS-aligned.apk
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs INGLES-SEBAS-v2.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: INGLES-SEBAS-v2.0.0
          path: INGLES-SEBAS-v2.0.0.apk
          if-no-files-found: error
          retention-days: 30
